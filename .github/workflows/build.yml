name: Build Minutia

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Sanity-check Google Fonts CSS format
        continue-on-error: true
        run: curl -s -A "Mozilla/4.0 (compatible; MSIE 6.0)" "https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700" | head -12

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Minutia-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Minutia-apk
          path: Minutia-*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Minutia build ${{ github.run_number }}
          files: Minutia-*.apk
