name: Build Minutia

# Every push to main is build-checked. A GitHub Release is published only when
# version.properties holds a version that hasn't been released yet.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need tags to know which versions are already released

      - name: Read version
        id: version
        run: |
          v=$(grep -E '^VERSION_NAME=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::VERSION_NAME '$v' must look like 1.2.3"; exit 1; fi
          echo "name=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "v$v is already released; this run only checks the build."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "v$v is new; this run will publish it."
          fi

      - name: Check Google Fonts endpoints the app relies on
        continue-on-error: true
        shell: bash
        run: |
          set +e
          UA="curl/8.5.0"
          meta=$(curl -s -A "$UA" https://fonts.google.com/metadata/fonts)
          echo "catalogue: $(echo -n "$meta" | wc -c) bytes, $(echo "$meta" | grep -o '"family": *"[^"]*"' | sort -u | wc -l) families"
          echo "$meta" | grep -o '"family": *"Fragment Mono"' | head -1
          for fam in "fragment+mono" "Fragment+Mono" "Fragment+Mono:wght@700" "Space+Grotesk:wght@700"; do
            code=$(curl -s -o /tmp/css -w '%{http_code}' -A "$UA" "https://fonts.googleapis.com/css2?family=$fam")
            url=$(grep -o "src: *url([^)]*)" /tmp/css | head -1 | sed -E "s/src: *url\(['\"]?([^)'\"]*).*/\1/")
            magic=""; [ -n "$url" ] && magic=$(curl -s -A "$UA" "$url" | head -c 4 | xxd -p)
            echo "$fam -> HTTP $code, font magic: ${magic:-none}"
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Name APK
        run: cp app/build/outputs/apk/release/app-release.apk "Minutia-${{ steps.version.outputs.name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Minutia-${{ steps.version.outputs.name }}-${{ github.sha }}
          path: Minutia-*.apk

      - name: Release notes from CHANGELOG.md
        if: steps.version.outputs.release == 'true'
        run: |
          v="${{ steps.version.outputs.name }}"
          awk -v v="$v" '
            $0 ~ "^## \\[" v "\\]" { on=1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "No CHANGELOG.md entry for $v." > notes.md; fi
          cat notes.md

      - name: Publish release
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: Minutia ${{ steps.version.outputs.name }}
          body_path: notes.md
          files: Minutia-*.apk
          make_latest: true
