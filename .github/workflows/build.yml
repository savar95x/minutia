name: Build Minutia

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Check which user-agents get TTF from Google Fonts
        continue-on-error: true
        run: |
          for ua in "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_6_8) AppleWebKit/534.59.8 (KHTML, like Gecko) Version/5.1.9 Safari/534.59.8" "curl/8.5.0" "Mozilla/5.0 (Linux; U; Android 4.0.3; en-us) AppleWebKit/534.30 (KHTML, like Gecko) Version/4.0 Mobile Safari/534.30"; do
            for fam in "Space+Grotesk:wght@700" "Bebas+Neue"; do
              url=$(curl -s -A "$ua" "https://fonts.googleapis.com/css2?family=$fam" | grep -o "src: *url([^)]*)" | head -1 | sed -E "s/src: *url\(['\"]?([^)'\"]*).*/\1/")
              magic=$(curl -s -A "$ua" "$url" | head -c 4 | xxd -p)
              echo "UA=${ua:0:40} | $fam | magic=$magic | $url"
            done
          done

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Minutia-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Minutia-apk
          path: Minutia-*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Minutia build ${{ github.run_number }}
          files: Minutia-*.apk
