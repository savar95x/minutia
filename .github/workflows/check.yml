name: Branch check

# Build-checks pushes to branches other than main (main releases). The build log and APK go to the orphan
# branch "check-log", so the result is readable with plain git, no gh token needed (scripts/check-wait.sh).
on:
  push:
    branches-ignore: [main, check-log, shots, ci-log]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Build release APK
        run: |
          set -o pipefail
          gradle :app:assembleRelease --stacktrace 2>&1 | tee /tmp/gradle.log

      - name: Publish to check-log branch
        if: always()
        run: |
          mkdir -p /tmp/out && cp /tmp/gradle.log /tmp/out/ 2>/dev/null || true
          cp app/build/outputs/apk/release/*.apk /tmp/out/app.apk 2>/dev/null || true
          cd /tmp/out
          echo "${{ github.sha }}" > SHA
          git init -q -b check-log
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Check for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" check-log
